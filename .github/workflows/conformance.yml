name: Semantic mutation conformance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    env:
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SUBJECT_SHA }}

      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.0
          cache: false

      - name: Verify Go 1.27
        run: test "$(go env GOVERSION)" = "go1.27.0"

      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          files=$(gofmt -l $(git ls-files '*.go'))
          test -z "$files"

      - name: Verify vet
        run: go vet ./...

      - name: Verify tests
        run: go test ./...

      - name: Verify build
        run: go build -trimpath -o "$RUNNER_TEMP/gooo-semantic-mutation-lab-bin" ./cmd/gooo-semantic-mutation-lab

      - name: Run source to IR to mutant artifacts to report
        shell: bash
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/gooo-semantic-mutation-lab-bin"
          work="$RUNNER_TEMP/gooo-semantic-mutation-lab-work"
          mkdir -p "$work/first" "$work/replay"
          source=examples/semantic-mutation-lab-v1/lab.gooo
          contract=contracts/denominator-v1.json
          before=$(git status --porcelain=v1 -z --untracked-files=all | sha256sum | awk '{print $1}')

          "$bin" run \
            --source "$source" --contract "$contract" --out "$work/first"
          after=$(git status --porcelain=v1 -z --untracked-files=all | sha256sum | awk '{print $1}')
          test "$before" = "$after"

          "$bin" run \
            --source "$source" --contract "$contract" --out "$work/replay"
          cmp -s "$work/first/ir.json" "$work/replay/ir.json"
          cmp -s "$work/first/mutation-report.json" "$work/replay/mutation-report.json"
          cmp -s "$work/first/mutation-report.md" "$work/replay/mutation-report.md"

          jq -e '
            .schema == "gooo/semantic-mutation-lab/report/v1" and
            .decision == "SEMANTIC_MUTATION_CONFORMANCE_REPORTED" and
            .fixed_conformance_denominator == 12 and
            .summary == {generated:12,attempted:12,killed:10,unknown:1,refuted:1} and
            .authority == {repository_writes:0,local_test_executions:0,cross_project_required_gates:0,product_generation_authorized:false,root_readme_policy:"EXCLUDED_FROM_REPOSITORY_INVENTORY"} and
            .precedence == ["REFUTED","UNKNOWN","CLOSED"] and
            .improvement.state == "UNKNOWN" and
            .improvement.reason == "EXACT_BEFORE_AFTER_IMPROVEMENT_PAIR_NOT_PROVIDED" and
            ([.mutants[]|select(.state=="KILLED")]|length) == 10 and
            ([.mutants[]|select(.state=="SURVIVED_UNKNOWN")]|length) == 1 and
            ([.mutants[]|select(.state=="INVALID_REFUTED")]|length) == 1 and
            ([.mutants[]|select(.state=="SURVIVED_UNKNOWN")|
              (.claim.stage != "" and .claim.step != "" and .claim.reason != "" and .claim.unknown_class != "" and .claim.next_operation != "" and (.claim.blocked_by|length)>0)]|all) and
            ([.mutants[]|select(.mutant_id=="MUT-11-UNKNOWN-FRONTIER" and .state=="INVALID_REFUTED")]|length) == 1 and
            ([.mutants[]|select(.artifact_digest|startswith("sha256:"))]|length) == 12 and
            (has("mutation_percentage")|not) and (has("mutation_score")|not)
          ' "$work/first/mutation-report.json"

          test "$(jq -r '.generated' "$work/first/generation-receipt.json")" = 12
          test "$(jq -r '.attempted' "$work/first/generation-receipt.json")" = 12
          test "$(find "$work/first/mutants" -type f -name '*.json' | wc -l | tr -d ' ')" = 12

          forbidden="$GITHUB_WORKSPACE/.gooo-semantic-mutation-lab-forbidden-output"
          if "$bin" run \
            --source "$source" --contract "$contract" --out "$forbidden"; then
            echo "repository-owned output was accepted" >&2
            exit 1
          fi
          test ! -e "$forbidden"

      - name: Publish human-facing exact-count summary
        run: cat "$RUNNER_TEMP/gooo-semantic-mutation-lab-work/first/mutation-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload machine and human evidence
        uses: actions/upload-artifact@v4
        with:
          name: gooo-semantic-mutation-lab-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/gooo-semantic-mutation-lab-work/first
          if-no-files-found: error
